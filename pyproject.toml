[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-at-rest"
version = "0.1.0"
description = "Read-only Azure encryption-at-rest technical evidence collector"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
azure-at-rest = "azure_at_rest.cli:main"

[tool.setuptools.packages.find]
include = ["azure_at_rest*"]
