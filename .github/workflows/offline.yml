name: Offline validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python -m build --no-isolation
      - run: python scripts/package_functions.py --output dist/functions-source.zip
      - name: Build Linux Functions runtime package
        if: runner.os == 'Linux'
        run: python scripts/build_functions_package.py --output dist/functions-runtime.zip
      - name: Smoke test Functions runtime locally
        if: runner.os == 'Linux'
        run: python scripts/smoke_functions_runtime.py --package dist/functions-runtime.zip --output "$RUNNER_TEMP/functions-runtime-check"
