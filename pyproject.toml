[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-at-rest"
version = "0.2.0"
description = "Read-only Azure encryption-at-rest technical evidence collector"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["reportlab>=4.4,<5"]
test = ["pypdf>=6,<7"]

[tool.setuptools.package-data]
azure_at_rest = ["program_scope.json"]

[project.scripts]
azure-at-rest = "azure_at_rest.cli:main"

[tool.setuptools.packages.find]
include = ["azure_at_rest*"]
